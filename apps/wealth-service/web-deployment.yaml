apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealth-frontend
  namespace: wealth-service
  labels:
    app.kubernetes.io/name: wealth-frontend
    app.kubernetes.io/instance: wealth-frontend
    app.kubernetes.io/component: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: wealth-frontend
      app.kubernetes.io/instance: wealth-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: wealth-frontend
        app.kubernetes.io/instance: wealth-frontend
        app.kubernetes.io/component: frontend

    spec:
      imagePullSecrets:
        - name: ghcr

      containers:
        - name: wealth-frontend
          image: ghcr.io/pestana1213/wealth-frontend

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: WEALTH_API_URL
              value: http://wealth-service.wealth-service.svc.cluster.local:8080

            # The public address, used to build the OIDC redirect_uri. It has to
            # be set here: behind the Tailscale ingress the pod sees an internal
            # host, and a redirect_uri built from that would not match the one
            # registered in Zitadel.
            - name: APP_BASE_URL
              value: https://wealth.tail654c62.ts.net

            # Must be the public issuer even from inside the cluster, because it
            # is compared against the `iss` claim of every token.
            - name: ZITADEL_ISSUER
              value: https://zitadel.tail654c62.ts.net

            - name: ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wealth-frontend-auth
                  key: clientId

            - name: ZITADEL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealth-frontend-auth
                  key: clientSecret

            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealth-frontend-auth
                  key: sessionSecret

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: 128Mi
              cpu: 100m

            limits:
              memory: 256Mi
              cpu: 500m
