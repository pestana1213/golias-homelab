apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealth-service
  namespace: wealth-service
  labels:
    app.kubernetes.io/name: wealth-service
    app.kubernetes.io/instance: wealth-service
    app.kubernetes.io/component: backend

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wealth-service
      app.kubernetes.io/instance: wealth-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: wealth-service
        app.kubernetes.io/instance: wealth-service
        app.kubernetes.io/component: backend

    spec:
      imagePullSecrets:
        - name: ghcr

      containers:
        - name: wealth-service
          image: ghcr.io/pestana1213/wealth-service

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://wealth-service-postgres:5432/wealth

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wealth-service-db
                  key: username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wealth-service-db
                  key: password

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65"

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

            - name: OTEL_SERVICE_NAME
              value: wealth-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homelab,service.namespace=wealth-service

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            failureThreshold: 3

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"

            limits:
              memory: "768Mi"