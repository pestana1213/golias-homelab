apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealth-service
  namespace: wealth-service
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - wealth-service
  rules:
    - host: wealth-service
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wealth-service
                port:
                  number: 8080
