apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wealth-service
  namespace: wealth-service
  labels:
    app.kubernetes.io/name: wealth-service
    app.kubernetes.io/instance: wealth-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wealth-service

  # Single-node homelab. A high maxReplicas does not buy capacity here, it only
  # converts load spikes into Pending pods: the scheduler has nowhere to put the
  # third pod, so maxReplicas: 5 was the mechanical cause of FailedScheduling.
  #
  # minReplicas 1 is affordable now that the load-test harness is paused. The
  # Deployment pairs this with maxSurge: 1 / maxUnavailable: 0, so a rollout
  # still never drops the last serving pod.
  minReplicas: 1
  maxReplicas: 2

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 80% of 200m = 160m. The previous 70% (140m) sat below the sustained
          # cost of JVM startup, so every deploy or GC pause drove a scale-up.
          averageUtilization: 80

  behavior:
    scaleUp:
      # A JVM that starts at ~0.5 cores must not be read as sustained load.
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Slow to scale down so a rollout does not fight the autoscaler.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120