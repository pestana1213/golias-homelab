apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wealth-frontend-auth
  namespace: wealth-service

spec:
  refreshInterval: 24h

  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  target:
    name: wealth-frontend-auth
    creationPolicy: Owner

  data:
    # The Zitadel application wealth-frontend. The secret is what lets the
    # Next server authenticate itself at the token endpoint; it never reaches
    # the browser.
    - secretKey: clientId
      remoteRef:
        key: wealth-frontend/oidc
        property: clientId

    - secretKey: clientSecret
      remoteRef:
        key: wealth-frontend/oidc
        property: clientSecret

    # Encrypts the session cookie. Rotating it signs every user out, which is
    # the only way to revoke sessions in bulk.
    - secretKey: sessionSecret
      remoteRef:
        key: wealth-frontend/oidc
        property: sessionSecret
