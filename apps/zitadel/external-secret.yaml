# The database credentials, plus the DSN ZITADEL itself reads. The DSN is
# templated from the same two keys so there is one place to rotate them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-db
  namespace: zitadel

spec:
  refreshInterval: 24h

  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  target:
    name: zitadel-db
    creationPolicy: Owner
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        # In-cluster traffic to the pod next door, as for every other app here.
        dsn: "postgresql://{{ .username }}:{{ .password }}@zitadel-postgres.zitadel.svc.cluster.local:5432/zitadel?sslmode=disable"

  data:
    - secretKey: username
      remoteRef:
        key: zitadel/database
        property: username

    - secretKey: password
      remoteRef:
        key: zitadel/database
        property: password
---
# Encrypts the secrets ZITADEL stores. It CANNOT be rotated: losing it means
# losing access to everything it encrypted, so it belongs in Vaultwarden too.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel

spec:
  refreshInterval: 24h

  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  target:
    name: zitadel-masterkey
    creationPolicy: Owner

  data:
    - secretKey: masterkey
      remoteRef:
        key: zitadel/masterkey
        property: masterkey
---
# Signs the Login V2 session cookies. Needs chart >= 10.1.0 and login >= v4.19.2.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-login-session-cookie
  namespace: zitadel

spec:
  refreshInterval: 24h

  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  target:
    name: zitadel-login-session-cookie
    creationPolicy: Owner

  data:
    - secretKey: ZITADEL_SESSION_COOKIE_SECRET
      remoteRef:
        key: zitadel/login
        property: sessionCookieSecret
---
# The keypair the Login V2 app uses to authenticate to ZITADEL. The chart can
# generate it, but ArgoCD re-renders the chart on every sync and would hand out
# a different key each time, so it is pinned here instead.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-login-service-key
  namespace: zitadel

spec:
  refreshInterval: 24h

  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  target:
    name: zitadel-login-service-key
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tlsCrt }}"
        tls.key: "{{ .tlsKey }}"

  data:
    - secretKey: tlsCrt
      remoteRef:
        key: zitadel/login
        property: tlsCrt

    - secretKey: tlsKey
      remoteRef:
        key: zitadel/login
        property: tlsKey
