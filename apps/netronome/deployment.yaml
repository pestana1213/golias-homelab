apiVersion: apps/v1
kind: Deployment
metadata:
  name: netronome
  namespace: netronome
  labels:
    app: netronome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netronome
  template:
    metadata:
      labels:
        app: netronome
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: data-ownership
          image: ghcr.io/autobrr/netronome:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - chown -R netronome:netronome /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_READ_SEARCH"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: netronome
          image: ghcr.io/autobrr/netronome:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Lisbon
            - name: NETRONOME__HOST
              value: "0.0.0.0"
            - name: NETRONOME__PORT
              value: "7575"
          ports:
            - name: http
              containerPort: 7575
          securityContext:
            capabilities:
              add:
                - NET_RAW
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netronome-data
