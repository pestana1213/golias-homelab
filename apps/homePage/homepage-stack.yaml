---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Golias Homelab
    favicon: https://gethomepage.dev/img/favicon.ico
    headerStyle: boxed
    theme: dark
    color: slate
    background:
      image: https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?auto=format&fit=crop&w=2000&q=80
      blur: md
      saturate: 50
      brightness: 50
      opacity: 20
    cardBlur: md
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
    layout:
      - Monitoring:
          style: row
          columns: 3
      - Apps:
          style: row
          columns: 2
      - Tools:
          style: row
          columns: 2
      - Calendar:
          style: row
          columns: 1
  
  services.yaml: |
    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: http://grafana.golias.home
            description: Metrics and dashboards
            siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: admin
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"

        - Prometheus:
            icon: prometheus.png
            href: http://prometheus.golias.home
            description: Metrics collection
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

        - AdGuard Home:
            icon: adguard-home.png
            href: http://adguard.golias.home
            description: DNS ad blocking
            siteMonitor: http://adguard-service.adguard.svc.cluster.local
            widget:
              type: adguard
              url: http://adguard-service.adguard.svc.cluster.local

    - Apps:
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vaultwarden
            description: Password manager
            siteMonitor: http://vaultwarden.vaultwarden.svc.cluster.local

        - Immich:
            icon: immich.png
            href: https://immich
            description: Photo library
            siteMonitor: http://immich-service.immich.svc.cluster.local:2283

    - Calendar:
        - Portuguese Calendar:
            icon: mdi-calendar-month
            description: Events and public holidays
            widget:
              type: calendar
              firstDayInWeek: monday
              view: monthly
              maxEvents: 10
              showTime: true
              timezone: Europe/Lisbon
              integrations:
                - type: ical
                  url: https://calendar.google.com/calendar/ical/pt.portuguese%23holiday%40group.v.calendar.google.com/public/basic.ics
                  name: Portuguese Holidays
                  color: red
                  params:
                    showName: true
  
  widgets.yaml: |
    - openmeteo:
        label: Fafe
        latitude: 41.45
        longitude: -8.17
        timezone: Europe/Lisbon
        units: metric
        cache: 5
    
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
  
  kubernetes.yaml: |
    mode: cluster
  
  docker.yaml: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
        - name: config-setup
          image: busybox:latest
          command: ['sh', '-c']
          args:
            - |
              cp /tmp/config/* /app/config/ 2>/dev/null || true
              chmod -R 777 /app/config
          volumeMounts:
            - name: config-source
              mountPath: /tmp/config
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
          env:
            - name: TZ
              value: Europe/Lisbon
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.local,192.168.1.225
            - name: HOMEPAGE_VAR_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-grafana
                  key: password
      volumes:
        - name: config-source
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: homepage
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: homepage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: home.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000