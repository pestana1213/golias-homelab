apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-logs.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["homelab", "logs", "loki"],
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Kubernetes Logs Explorer",
      "uid": "k8s-logs-explorer",
      "version": 1,
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values(namespace)",
            "hide": 0,
            "includeAll": true,
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": "label_values(namespace)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query",
            "label": "Namespace"
          },
          {
            "current": {},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values({namespace=\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "pod",
            "options": [],
            "query": "label_values({namespace=\"$namespace\"}, pod)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query",
            "label": "Pod"
          },
          {
            "current": {},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values({namespace=\"$namespace\"}, container)",
            "hide": 0,
            "includeAll": true,
            "multi": false,
            "name": "container",
            "options": [],
            "query": "label_values({namespace=\"$namespace\"}, container)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query",
            "label": "Container"
          },
          {
            "current": {"selected": false, "text": "", "value": ""},
            "hide": 0,
            "name": "search",
            "options": [{"selected": true, "text": "", "value": ""}],
            "query": "",
            "type": "textbox",
            "label": "Search"
          }
        ]
      },
      "panels": [
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "bars",
                "fillOpacity": 50,
                "gradientMode": "none",
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "normal"},
                "thresholdsStyle": {"mode": "off"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "title": "Log Rate",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "loki"},
              "expr": "sum(rate({namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |= \"$search\" [1m])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 22, "w": 24, "x": 0, "y": 6},
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "title": "Logs — $namespace / $pod",
          "type": "logs",
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "loki"},
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |= \"$search\"",
              "refId": "A",
              "maxLines": 500
            }
          ]
        }
      ]
    }
