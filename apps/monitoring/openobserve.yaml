apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openobserve
  namespace: argocd
spec:
  project: default
  source:
    chart: openobserve-standalone
    repoURL: https://charts.openobserve.ai
    targetRevision: 0.92.0
    helm:
      valuesObject:
        auth:
          existingRootUserSecret:
            name: openobserve-root
            emailKey: ZO_ROOT_USER_EMAIL
            passwordKey: ZO_ROOT_USER_PASSWORD
        persistence:
          enabled: true
          size: 20Gi
        config:
          ZO_CLUSTER_NAME: golias
          ZO_TELEMETRY: "false"
          ZO_USAGE_REPORTING_ENABLED: "false"
          # Keep the three signal-type memtables comfortably below the pod
          # memory limit and flush them to the persistent volume frequently.
          ZO_MAX_FILE_SIZE_IN_MEMORY: "64"
          ZO_MAX_FILE_SIZE_ON_DISK: "64"
          ZO_MEM_TABLE_MAX_SIZE: "768"
          ZO_MAX_FILE_RETENTION_TIME: "60"
          ZO_MEM_PERSIST_INTERVAL: "5"
          # Match Prometheus's three-day retention when remote-write replays WAL.
          ZO_INGEST_ALLOWED_UPTO: "72"
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openobserve-tailscale-ingress
  namespace: monitoring
  annotations:
    tailscale.com/hostname: openobserve
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - openobserve
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openobserve-openobserve-standalone
                port:
                  number: 5080
