---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress-v2
  namespace: monitoring
spec:
  rules:
    - host: grafana.pestana.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress-v2
  namespace: monitoring
spec:
  rules:
    - host: prometheus.pestana.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
