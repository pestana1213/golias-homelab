# Generated from an OpenObserve dashboard. Grafana's dashboard sidecar picks up
# every ConfigMap labelled grafana_dashboard: "1" in this namespace.
# Edits made in the Grafana UI are not saved back here: export the JSON and paste it below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-hub-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
