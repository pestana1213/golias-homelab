# Grafana dashboards, one ConfigMap each. Grafana's dashboard sidecar loads every
# ConfigMap labelled grafana_dashboard: "1" in the monitoring namespace.
# The OpenObserve dashboards in ../openobserve are imported by hand in its UI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - homelab-overview-dashboard.yaml
  - kubernetes-logs-dashboard.yaml
  - wealth-service-dashboard.yaml
  - control-hub-dashboard.yaml
  - golias-web-dashboard.yaml
  - zitadel-dashboard.yaml
