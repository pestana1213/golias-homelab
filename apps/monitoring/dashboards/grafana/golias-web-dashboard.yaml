# Generated from an OpenObserve dashboard. Grafana's dashboard sidecar picks up
# every ConfigMap labelled grafana_dashboard: "1" in this namespace.
# Edits made in the Grafana UI are not saved back here: export the JSON and paste it below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golias-web-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  golias-web.json: |
    {
      "uid": "golias-web",
      "title": "Golias Web",
      "description": "Dashboard traffic, cluster API proxy health, errors, and Node.js runtime metrics for Golias Web.",
      "tags": [
        "golias-web",
        "nodejs"
      ],
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "OpenObserve (logs, RUM)",
          "type": "link",
          "icon": "external link",
          "url": "https://openobserve.tail654c62.ts.net",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "Dashboard request rate",
          "description": "Dashboard page requests per second, by route.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route) (rate(golias_web_requests_total[$__rate_interval]))",
              "legendFormat": "{{route}}",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "title": "Cluster API request rate",
          "description": "Requests proxied to the cluster API (control-hub) per second, by response status.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status) (rate(golias_web_cluster_api_requests_total[$__rate_interval]))",
              "legendFormat": "HTTP {{status}}",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "title": "Average cluster API latency",
          "description": "Mean duration of each request proxied to the cluster API over the selected rate interval.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(golias_web_cluster_api_request_duration_seconds_sum[$__rate_interval])) / clamp_min(sum(rate(golias_web_cluster_api_request_duration_seconds_count[$__rate_interval])), 0.000001)",
              "legendFormat": "Cluster API",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "title": "Cluster API reachable",
          "description": "Whether the most recent cluster API call reached it (100%) or failed at the transport level (0%).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 9,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(golias_web_cluster_api_up)",
              "legendFormat": "Reachable",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "title": "Server errors",
          "description": "Server errors reported by Next.js (render and route failures) per second, by route.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route) (rate(golias_web_request_errors_total[$__rate_interval]))",
              "legendFormat": "{{route}}",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: err/s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "title": "Event loop lag",
          "description": "Maximum Node.js event loop lag reported by the dashboard process.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 17,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(nodejs_eventloop_lag_seconds)",
              "legendFormat": "Event loop lag",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "title": "Resident memory",
          "description": "Resident memory used by the golias-web process.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(process_resident_memory_bytes{namespace=\"control-hub\",service=\"golias-web\"})",
              "legendFormat": "Resident memory",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "title": "Process CPU usage",
          "description": "CPU utilization reported by the golias-web process.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 25,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "avg(rate(process_cpu_seconds_total{namespace=\"control-hub\",service=\"golias-web\"}[$__rate_interval]))",
              "legendFormat": "CPU",
              "range": true,
              "refId": "A"
            }
          ],
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
