apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wealth-loadtest-db
  namespace: wealth-loadtest

spec:
  refreshInterval: 24h

  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  target:
    name: wealth-loadtest-db
    creationPolicy: Owner

  # Same Vault entry as the production database. The load-test database is a
  # separate database on the same PostgreSQL instance, so it reuses the
  # superuser; Secrets are namespaced, so it still needs its own copy.
  data:
    - secretKey: username
      remoteRef:
        key: wealth-service/database
        property: username

    - secretKey: password
      remoteRef:
        key: wealth-service/database
        property: password