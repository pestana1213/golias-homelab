apiVersion: v1
kind: ConfigMap
metadata:
  name: wealth-loadtest-scripts
  namespace: wealth-loadtest
data:
  wealth-service.js: |-
    import { Counter, Rate, Trend } from 'k6/metrics';
    import { sleep } from 'k6';
    import exec from 'k6/execution';
    
    import {
      SHARED_USER, THINK_TIME_MS, SETUP_TIMEOUT,
      TOP_UP_EVERY, W_INCOME, W_EXPENSE, W_ACCOUNT_TRANSFER, W_BUCKET_ALLOCATE, W_BUCKET_RELEASE,
      scenarios, thresholds,
    } from './lib/config.js';
    import { provisionUsers, createTransaction, readDashboard, healthCheck } from './lib/api.js';
    import {
      income, expense, accountTransfer, allocateToBucket, releaseFromBucket,
    } from './lib/workload.js';
    
    const txDuration = new Trend('transaction_duration', true);
    const dashboardDuration = new Trend('dashboard_duration', true);
    const conflictRate = new Rate('conflict_rate');
    const unexpected = new Counter('unexpected_responses');
    
    const transactionsCreated = new Counter('transactions_created');
    const transactionsConflict = new Counter('transactions_conflict');
    const transactionsRejected = new Counter('transactions_rejected');
    const transactionsFailed = new Counter('transactions_failed');
    
    export const options = {
      scenarios: scenarios(),
      thresholds: thresholds(),
      setupTimeout: SETUP_TIMEOUT,
      discardResponseBodies: false,
      summaryTrendStats: ['avg', 'min', 'med', 'p(90)', 'p(95)', 'p(99)', 'max'],
    };
    
    // ---------------------------------------------------------------- setup ----
    // Onboards NUM_USERS (user + accounts + buckets) before the clock starts, so
    // the measured scenarios only exercise the transaction write path.
    export function setup() {
      healthCheck();
      const runId = exec.test.runId || String(Date.now());
      const users = provisionUsers(runId);
      console.log(
        'provisioned ' + users.length + ' users with ' + users[0].accounts.length +
        ' accounts and ' + users[0].buckets.length + ' buckets each'
      );
      return { users: users, runId: runId };
    }
    
    // Every VU owns an isolated JS runtime, so this ledger is per VU. It tracks,
    // per bucket, how much this VU has allocated and not yet released, so a
    // release can never overdraw a bucket and trip the "final value < 0" 400.
    // Amounts are held in integer cents to avoid float drift.
    let ledger = {};
    
    /** Stable user assignment: VU n owns user n, so contention is controllable. */
    function userFor(data) {
      if (SHARED_USER) return data.users[0];
      return data.users[(exec.vu.idInTest - 1) % data.users.length];
    }
    
    function ledgerCents(bucketId) {
      return ledger[bucketId] || 0;
    }
    
    function ledgerCredit(bucketId, amount) {
      ledger[bucketId] = ledgerCents(bucketId) + Math.round(amount * 100);
    }
    
    function ledgerDebit(bucketId, amount) {
      ledger[bucketId] = ledgerCents(bucketId) - Math.round(amount * 100);
    }
    
    /**
     * The bucket holding the largest unreleased allocation plus a safe amount to
     * release from it: at most half of it, so that VUs sharing the same user can
     * never drive a bucket negative.
     */
    function releaseCandidate() {
      let bestId = null;
      let bestCents = 0;
      Object.keys(ledger).forEach(function (bucketId) {
        const cents = ledger[bucketId];
        if (cents > bestCents) {
          bestCents = cents;
          bestId = bucketId;
        }
      });
      if (bestId === null) return null;
      const amount = Math.floor(bestCents * 0.5) / 100;
      if (amount < 0.01) return null;
      return { bucketId: bestId, amount: amount };
    }
    
    function record(res) {
      txDuration.add(res.timings.duration);
    
      switch (res.status) {
        case 201:
          transactionsCreated.add(1);
          conflictRate.add(false);
          break;
        case 409:
          // Documented behaviour: FOR UPDATE NOWAIT, no wait and no retry.
          transactionsConflict.add(1);
          conflictRate.add(true);
          break;
        case 400:
          transactionsRejected.add(1);
          conflictRate.add(false);
          break;
        default:
          transactionsFailed.add(1);
          conflictRate.add(false);
          unexpected.add(1, { status: String(res.status) });
          break;
      }
    
      return res;
    }
    
    function send(payload) {
      return record(createTransaction(payload, { route: payload.type }));
    }
    
    // ------------------------------------------------------- transaction load --
    export function transactions(data) {
      const user = userFor(data);
      const iteration = exec.scenario.iterationInTest;
    
      // Periodic income keeps account balances away from the underflow guard
      // without polluting the write mix.
      if (TOP_UP_EVERY > 0 && iteration % TOP_UP_EVERY === 0) {
        send(income(user));
      }
    
      const total = W_INCOME + W_EXPENSE + W_ACCOUNT_TRANSFER + W_BUCKET_ALLOCATE + W_BUCKET_RELEASE;
      let roll = Math.random() * total;
    
      if ((roll -= W_INCOME) < 0) {
        send(income(user));
      } else if ((roll -= W_EXPENSE) < 0) {
        send(expense(user));
      } else if ((roll -= W_ACCOUNT_TRANSFER) < 0) {
        send(accountTransfer(user));
      } else if ((roll -= W_BUCKET_ALLOCATE) < 0) {
        const payload = allocateToBucket(user);
        send(payload);
        // Credit the ledger even on 409: the release path is a separate request,
        // and under-releasing is safe while over-releasing is not.
        ledgerCredit(payload.destinationBucketId, payload.transactionAmount);
      } else {
        // Bucket release needs a matching allocation. In SHARED_USER mode the
        // ledger is meaningless because all VUs share one bucket, so fall back.
        const candidate = (!SHARED_USER && releaseCandidate());
        if (candidate) {
          send(releaseFromBucket(user, candidate.bucketId, candidate.amount));
          ledgerDebit(candidate.bucketId, candidate.amount);
        } else if (user.buckets.length > 0) {
          send(accountTransfer(user));
        } else {
          send(income(user));
        }
      }
    
      if (THINK_TIME_MS > 0) sleep(Math.random() * THINK_TIME_MS / 1000);
    }
    
    // ----------------------------------------------------------- read load ----
    export function dashboardReads(data) {
      const user = userFor(data);
      const res = readDashboard(user.id);
      dashboardDuration.add(res.timings.duration);
      if (res.status !== 200) {
        unexpected.add(1, { status: String(res.status) });
      }
      if (THINK_TIME_MS > 0) sleep(Math.random() * THINK_TIME_MS / 1000);
    }

  config.js: |-
    const env = __ENV;
    
    function int(value, fallback) {
      if (value === undefined || value === null || value === '') return fallback;
      return parseInt(value, 10);
    }
    
    function num(value, fallback) {
      if (value === undefined || value === null || value === '') return fallback;
      return Number(value);
    }
    
    function bool(value, fallback) {
      if (value === undefined || value === null || value === '') return fallback;
      return String(value).toLowerCase() === 'true' || value === '1';
    }
    
    /** "10:1m,100:2m,0:15s" -> [{ target: 10, duration: '1m' }, ...] */
    function stages(raw, fallback) {
      if (!raw) return fallback;
      return raw.split(',').map(function (chunk) {
        const parts = chunk.split(':');
        return { target: parseInt(parts[0], 10), duration: (parts[1] || '1m').trim() };
      });
    }
    
    export const BASE_URL = (env.BASE_URL || 'http://localhost:8080').replace(/\/+$/, '');
    export const SETUP_TIMEOUT = env.SETUP_TIMEOUT || '5m';
    export const SETUP_CONCURRENCY = int(env.SETUP_CONCURRENCY, 25);
    
    // --- test data shape -------------------------------------------------------
    export const NUM_USERS = int(env.NUM_USERS, 200);
    export const ACCOUNTS_PER_USER = int(env.ACCOUNTS_PER_USER, 2);
    export const BUCKETS_PER_USER = int(env.BUCKETS_PER_USER, 3);
    export const INITIAL_BALANCE = num(env.INITIAL_BALANCE, 10000000.0);
    
    // Pin every VU onto user #1 and its accounts. Turns the run into a pure
    // row-lock contention test: every write fights for the same FOR UPDATE NOWAIT
    // locks and you should see the 409 rate climb.
    export const SHARED_USER = bool(env.SHARED_USER, false);
    
    // --- write mix (weights are relative, they do not have to add up to 100) ----
    export const W_INCOME = num(env.W_INCOME, 10);
    export const W_EXPENSE = num(env.W_EXPENSE, 30);
    export const W_ACCOUNT_TRANSFER = num(env.W_ACCOUNT_TRANSFER, 30);
    export const W_BUCKET_ALLOCATE = num(env.W_BUCKET_ALLOCATE, 20);
    export const W_BUCKET_RELEASE = num(env.W_BUCKET_RELEASE, 10);
    
    export const AMOUNT_MIN = num(env.AMOUNT_MIN, 2);
    export const AMOUNT_MAX = num(env.AMOUNT_MAX, 50);
    export const TOP_UP_EVERY = int(env.TOP_UP_EVERY, 25);
    export const TOP_UP_AMOUNT = num(env.TOP_UP_AMOUNT, 50000);
    
    // --- executors -------------------------------------------------------------
    // arrival: open model, one transaction per iteration at a fixed rate. Use this
    //          to find the saturation point (it keeps pushing while latency rises).
    // vus:     closed model, N concurrent users. Use this for per-user latency.
    export const EXECUTOR = env.EXECUTOR || 'arrival';
    export const DURATION = env.DURATION || '1m';
    export const RAMP_STAGES = stages(env.RAMP_STAGES, [
      { target: 25, duration: '30s' },
      { target: 100, duration: DURATION },
      { target: 0, duration: '15s' },
    ]);
    export const MAX_VUS = int(env.MAX_VUS, 300);
    export const PRE_ALLOCATED_VUS = int(env.PRE_ALLOCATED_VUS, 50);
    
    // The read scenario is paced by arrival rate too. A plain constant-vus loop
    // with no think time turns into a read firehose that starves the write
    // scenario and tells you nothing about mixed-load behaviour.
    export const READ_RATE = int(env.READ_RATE, 20);
    export const READ_STAGES = stages(env.READ_STAGES, [{ target: READ_RATE, duration: DURATION }]);
    
    // --- misc ------------------------------------------------------------------
    export const THINK_TIME_MS = int(env.THINK_TIME_MS, 0);
    export const TIMEOUT = env.TIMEOUT || '30s';
    export const TAGS = { suite: 'wealth-service' };
    
    export const READ_THRESHOLD_MS = int(env.READ_THRESHOLD_MS, 500);
    export const WRITE_THRESHOLD_MS = int(env.WRITE_THRESHOLD_MS, 750);
    
    export const ACCOUNT_NAMES = ['Bank', 'Broker', 'Cash', 'Poupanca', 'XTB'];
    export const BUCKET_NAMES = ['Casa', 'Emergencia', 'Carro', 'Investimento', 'Festas'];
    export const CATEGORIES = ['HOUSE', 'EMERGENCY', 'CAR', 'INVESTMENT', 'OTHER'];
    
    /**
     * Statuses that must not be scored as HTTP failures:
     *  200/201 success, 409 the documented "row is locked" outcome, 400 business
     *  validation. Everything else (5xx, transport errors) is a real failure.
     *
     * Kept as a list because k6 2.x reads expectedStatuses() as an exact list of
     * statuses, not as a (min, max) range.
     */
    export const EXPECTED_STATUS_CODES = [200, 201, 400, 409];
    
    export function scenarios() {
      const out = {};
    
      out.transactions = {
        exec: 'transactions',
        startTime: '0s',
        gracefulStop: '30s',
        tags: { path: 'transactions' },
      };
    
      if (EXECUTOR === 'arrival') {
        out.transactions.executor = 'ramping-arrival-rate';
        out.transactions.startRate = int(env.START_RATE, 10);
        out.transactions.timeUnit = '1s';
        out.transactions.preAllocatedVUs = PRE_ALLOCATED_VUS;
        out.transactions.maxVUs = MAX_VUS;
        out.transactions.stages = RAMP_STAGES;
      } else {
        out.transactions.executor = 'ramping-vus';
        out.transactions.startVUs = 0;
        out.transactions.stages = stages(env.VUS_STAGES, [
          { target: MAX_VUS, duration: DURATION },
        ]);
      }
    
      if (READ_RATE > 0) {
        out.dashboard_reads = {
          executor: 'ramping-arrival-rate',
          exec: 'dashboardReads',
          startTime: '0s',
          startRate: Math.min(READ_RATE, int(env.READ_START_RATE, 5)),
          timeUnit: '1s',
          preAllocatedVUs: int(env.READ_PRE_ALLOCATED_VUS, 10),
          maxVUs: int(env.READ_MAX_VUS, 100),
          stages: READ_STAGES,
          gracefulStop: '30s',
          tags: { path: 'dashboard' },
        };
      }
    
      return out;
    }
    
    export function thresholds() {
      const t = {
        // Guards against a silently dead run: a scenario that throws on every
        // iteration produces zero checks and would otherwise pass every threshold.
        iterations: ['count>1'],
        http_req_duration: ['p(95)<' + (WRITE_THRESHOLD_MS + READ_THRESHOLD_MS)],
        transaction_duration: ['p(95)<' + WRITE_THRESHOLD_MS],
        unexpected_responses: ['count==0'],
        checks: ['rate>0.95'],
      };
    
      if (READ_RATE > 0) {
        t.dashboard_duration = ['p(95)<' + READ_THRESHOLD_MS];
      }
    
      // Under SHARED_USER the 409s are the measurement, not a regression.
      if (!SHARED_USER) {
        t.conflict_rate = ['rate<0.15'];
      }
    
      return t;
    }

  api.js: |-
    import http from 'k6/http';
    import { check } from 'k6';
    
    import {
      BASE_URL, TAGS, TIMEOUT,
      NUM_USERS, ACCOUNTS_PER_USER, BUCKETS_PER_USER, INITIAL_BALANCE, SETUP_CONCURRENCY,
      ACCOUNT_NAMES, BUCKET_NAMES,
    } from './config.js';
    
    // k6 2.x takes an exact status list here; (200, 499) would reject every 201.
    http.setResponseCallback(http.expectedStatuses(200, 201, 400, 409));
    
    const JSON_HEADERS = { 'Content-Type': 'application/json' };
    
    function post(path, body, tags) {
      return http.post(BASE_URL + path, JSON.stringify(body), {
        headers: JSON_HEADERS,
        timeout: TIMEOUT,
        tags: Object.assign({ name: path }, TAGS, tags || {}),
      });
    }
    
    function postBatch(requests) {
      return http.batch(
        requests.map(function (r) {
          return {
            method: 'POST',
            url: BASE_URL + r.path,
            body: JSON.stringify(r.body),
            params: {
              headers: JSON_HEADERS,
              timeout: TIMEOUT,
              tags: Object.assign({ name: r.path }, TAGS, r.tags || {}),
            },
          };
        })
      );
    }
    
    /**
     * Onboards NUM_USERS users: POST /users -> POST /accounts -> POST /buckets.
     * Runs inside setup(), so it is not attributed to the measured scenarios, and
     * uses http.batch to keep provisioning time reasonable at large user counts.
     */
    export function provisionUsers(runId) {
      const users = [];
      const byId = new Map();
    
      for (let batchStart = 0; batchStart < NUM_USERS; batchStart += SETUP_CONCURRENCY) {
        const batchSize = Math.min(SETUP_CONCURRENCY, NUM_USERS - batchStart);
        const emails = [];
    
        for (let i = 0; i < batchSize; i++) {
          const index = batchStart + i;
          emails.push('k6-' + runId + '-' + index + '@loadtest.local');
        }
    
        const userResponses = postBatch(
          emails.map(function (email, i) {
            return {
              path: '/users',
              body: { name: 'k6 User ' + (batchStart + i), email: email },
              tags: { phase: 'provision', entity: 'user' },
            };
          })
        );
    
        const children = [];
    
        userResponses.forEach(function (res, i) {
          const index = batchStart + i;
          if (res.status !== 201) {
            throw new Error(
              'provision: POST /users failed with ' + res.status + ' for ' + emails[i] +
              ' -> ' + (res.body || '').slice(0, 300)
            );
          }
          const userId = res.json('id');
          const user = { index: index, id: userId, accounts: [], buckets: [] };
          users.push(user);
          byId.set(userId, user);
    
          for (let a = 0; a < ACCOUNTS_PER_USER; a++) {
            children.push({
              userId: userId,
              bucket: 'account',
              slot: a,
              body: {
                userId: userId,
                name: ACCOUNT_NAMES[a % ACCOUNT_NAMES.length] + ' ' + index,
                currentAmount: INITIAL_BALANCE,
              },
            });
          }
    
          for (let b = 0; b < BUCKETS_PER_USER; b++) {
            children.push({
              userId: userId,
              bucket: 'bucket',
              slot: b,
              body: { userId: userId, name: BUCKET_NAMES[b % BUCKET_NAMES.length] + ' ' + index, currentAmount: 0 },
            });
          }
        });
    
        const childResponses = postBatch(
          children.map(function (c) {
            return {
              path: '/' + c.bucket + 's',
              body: c.body,
              tags: { phase: 'provision', entity: c.bucket },
            };
          })
        );
    
        childResponses.forEach(function (res, i) {
          const c = children[i];
          if (res.status !== 201) {
            throw new Error(
              'provision: POST /' + c.bucket + 's failed with ' + res.status +
              ' for user ' + c.userId + ' -> ' + (res.body || '').slice(0, 300)
            );
          }
          const target = c.bucket === 'account' ? byId.get(c.userId).accounts : byId.get(c.userId).buckets;
          target[c.slot] = res.json('id');
        });
      }
    
      users.forEach(function (u) {
        if (u.accounts.some(function (id) { return !id; })) throw new Error('provision: missing account id');
        if (u.buckets.some(function (id) { return !id; })) throw new Error('provision: missing bucket id');
      });
    
      return users;
    }
    
    export function createTransaction(body, tags) {
      const res = post('/transactions', body, Object.assign({ phase: 'workload' }, tags || {}));
      check(res, {
        'transaction responded 201 or 409': function (r) {
          return r.status === 201 || r.status === 409;
        },
        'transaction did not hit the server': function (r) {
          return r.status < 500;
        },
      });
      return res;
    }
    
    export function readDashboard(userId, tags) {
      const path = '/users/' + userId + '/dashboard';
      const res = http.get(BASE_URL + path, {
        timeout: TIMEOUT,
        tags: Object.assign({ name: path, phase: 'workload' }, TAGS, tags || {}),
      });
      check(res, {
        'dashboard responded 200': function (r) { return r.status === 200; },
      });
      return res;
    }
    
    export function healthCheck() {
      const res = http.get(BASE_URL + '/actuator/health', {
        timeout: TIMEOUT,
        tags: Object.assign({ name: '/actuator/health' }, TAGS),
      });
      if (res.status !== 200) {
        throw new Error(
          'service not healthy at ' + BASE_URL + ' (' + res.status + ') - start the app or set BASE_URL'
        );
      }
      return res;
    }

  workload.js: |-
    import { AMOUNT_MIN, AMOUNT_MAX, TOP_UP_AMOUNT, CATEGORIES, SHARED_USER } from './config.js';
    import { money, pickIndex, today } from './uuid.js';
    
    function base(user, type, amount, category, description) {
      return {
        userId: user.id,
        providerAccountId: null,
        destinationAccountId: null,
        sourceBucketId: null,
        destinationBucketId: null,
        transactionAmount: amount,
        type: type,
        category: category,
        occurredAt: today(),
        description: description,
      };
    }
    
    function randomAmount() {
      return money(AMOUNT_MIN, AMOUNT_MAX);
    }
    
    /**
     * INCOME: none -> Bank, no buckets.
     * Both the action's validate() and the `transaction_accounts` CHECK constraint
     * require providerAccountId and sourceBucketId to be NULL here.
     */
    export function income(user, amount) {
      const payload = base(user, 'INCOME', amount || TOP_UP_AMOUNT, 'OTHER', 'k6 income');
      payload.destinationAccountId = user.accounts[pickIndex(user.accounts.length)];
      return payload;
    }
    
    /**
     * EXPENSE: Account -> none, with an optional source bucket.
     * sourceBucketId stays NULL so the expense draws on unallocated cash; debiting
     * a bucket that a concurrent transaction is also touching is what produces the
     * 400 "final value < 0" rejections.
     */
    export function expense(user, amount) {
      const payload = base(user, 'EXPENSE', amount || randomAmount(), CATEGORIES[pickIndex(CATEGORIES.length)], 'k6 expense');
      payload.providerAccountId = user.accounts[pickIndex(user.accounts.length)];
      return payload;
    }
    
    /**
     * TRANSFER between two different accounts of the same user.
     * Lock order is normalised by UUID inside the action, so this exercises two
     * row locks without risking a deadlock.
     */
    export function accountTransfer(user, amount) {
      const payload = base(user, 'TRANSFER', amount || randomAmount(), 'OTHER', 'k6 account transfer');
      payload.providerAccountId = user.accounts[0];
      payload.destinationAccountId = user.accounts[user.accounts.length - 1];
      return payload;
    }
    
    /**
     * TRANSFER Bank -> Bank with none -> Bucket: money becomes allocated.
     * Both sides of the account are the same row, so only the bucket balance moves.
     */
    export function allocateToBucket(user, amount) {
      const payload = base(user, 'TRANSFER', amount || randomAmount(), 'INVESTMENT', 'k6 allocate');
      payload.providerAccountId = user.accounts[0];
      payload.destinationAccountId = user.accounts[0];
      payload.destinationBucketId = user.buckets[pickIndex(user.buckets.length)];
      return payload;
    }
    
    /**
     * TRANSFER Bank -> Bank with Bucket -> none: freeing an allocation.
     * This is the only path that debits a source bucket, so the caller must have
     * allocated first (see releasableAmount in the main script).
     */
    export function releaseFromBucket(user, bucketId, amount) {
      const payload = base(user, 'TRANSFER', amount || randomAmount(), 'INVESTMENT', 'k6 release');
      payload.providerAccountId = user.accounts[0];
      payload.destinationAccountId = user.accounts[0];
      payload.sourceBucketId = bucketId;
      return payload;
    }
    
    export const BUCKET_RELEASES_SUPPORTED = !SHARED_USER;

  uuid.js: |-
    import crypto from 'k6/crypto';
    
    const HEX = '0123456789abcdef';
    
    /**
     * RFC 4122 version 4 UUID built from k6's CSPRNG.
     * The service persists UUIDs in native Postgres `uuid` columns, so the value
     * only needs to be unique and correctly formatted.
     */
    export function uuid() {
      const bytes = new Uint8Array(crypto.randomBytes(16));
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
    
      let out = '';
      for (let i = 0; i < 16; i++) {
        if (i === 4 || i === 6 || i === 8 || i === 10) out += '-';
        out += HEX[(bytes[i] >> 4) & 0x0f] + HEX[bytes[i] & 0x0f];
      }
      return out;
    }
    
    export function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }
    
    export function pickIndex(length) {
      return Math.floor(Math.random() * length);
    }
    
    /** Two decimals, matching the NUMERIC(19, 2) columns. */
    export function money(min, max) {
      const cents = Math.floor(Math.random() * ((max - min + 1) * 100)) + min * 100;
      return cents / 100;
    }
    
    export function today() {
      return new Date().toISOString().slice(0, 10);
    }
