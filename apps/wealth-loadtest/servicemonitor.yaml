# Scraped alongside production. The OpenObserve dashboard filters on the
# `application` label (SPRING_APPLICATION_NAME on the Deployment), so load-test
# series are separable from real traffic rather than merged into it.
#
# The cluster Prometheus has an empty ServiceMonitor selector, so this is picked
# up automatically. That also means its series are remote-written to
# OpenObserve, sharing storage and the 3-day retention with production. Select
# the "Load test" environment on the dashboard to isolate them.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wealth-service-loadtest
  namespace: wealth-loadtest
  labels:
    app.kubernetes.io/part-of: wealth-service
    app.kubernetes.io/component: loadtest
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wealth-service-loadtest
  endpoints:
    - port: http
      path: /actuator/prometheus
      # Match the cluster-wide 60s scrape interval rather than hammering the
      # pod at 15s for a test workload.
      interval: 60s