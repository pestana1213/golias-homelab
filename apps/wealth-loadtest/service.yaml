apiVersion: v1
kind: Service
metadata:
  name: wealth-service-loadtest
  namespace: wealth-loadtest
  labels:
    app.kubernetes.io/name: wealth-service-loadtest
    app.kubernetes.io/part-of: wealth-service
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: wealth-service-loadtest
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  # Deliberately no Ingress: the load test is driven from inside the cluster
  # by the k6 Job and must not be reachable from the tailnet.
  type: ClusterIP