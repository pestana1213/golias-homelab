apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: task-manager
          image: ghcr.io/pestana1213/manager
          ports:
            - containerPort: 8080
