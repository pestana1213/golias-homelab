apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cosmo-secret
  namespace: task-manager
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cosmo-secret
  data:
    - secretKey: GRAPH_API_TOKEN
      remoteRef:
        key: cosmo
        property: graphApiToken
