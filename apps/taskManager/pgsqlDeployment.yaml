apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlhub-db
  namespace: task-manager
spec:
  # Paused: not in use. See pvc.yaml, which is preserved.
  replicas: 0
  selector:
    matchLabels:
      app: controlhub-db
  template:
    metadata:
      labels:
        app: controlhub-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: controlhub-db-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: controlhub-db-pvc