apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortner
  labels:
    app.kubernetes.io/name: url-shortner
    app.kubernetes.io/instance: url-shortner
    app.kubernetes.io/component: backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortner
  template:
    metadata:
      labels:
        app: url-shortner
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: url-shortner
          image: ghcr.io/pestana1213/url-shortner
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prd"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://url-shortner-postgres:5432/urlshortner
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: url-shortner-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: url-shortner-db
                  key: password
            - name: OTEL_SERVICE_NAME
              value: url-shortner
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homelab,service.namespace=url-shortner
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"