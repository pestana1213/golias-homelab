apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortner
  namespace: url-shortner
  labels:
    app.kubernetes.io/name: url-shortner
    app.kubernetes.io/instance: url-shortner
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - url-shortner
  rules:
    - host: url-shortner
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: url-shortner
                port:
                  number: 8080
