apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortner-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: url-shortner.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: url-shortner
                port:
                  number: 8080
