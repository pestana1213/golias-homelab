apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: url-shortner-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: url-shortner-db-secret
  dataFrom:
    - extract:
        key: url-shortner-db
