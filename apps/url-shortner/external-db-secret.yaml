apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: url-shortner-db
  namespace: url-shortner

spec:
  refreshInterval: 24h

  secretStoreRef:
    name: vault
    kind: ClusterSecretStore

  target:
    name: url-shortner-db
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: url-shortner/database
        property: username

    - secretKey: password
      remoteRef:
        key: url-shortner/database
        property: password
