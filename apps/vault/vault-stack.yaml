---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.29.1
    helm:
      valuesObject:
        injector:
          enabled: false
        server:
          standalone:
            enabled: true
          dataStorage:
            enabled: true
            size: 10Gi
          ui:
            enabled: true
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          extraContainers:
            - name: auto-unseal
              image: hashicorp/vault:1.18.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  while true; do
                    if ! vault status >/dev/null 2>&1; then
                      vault operator unseal "$VAULT_UNSEAL_KEY" >/dev/null 2>&1 || true
                    fi
                    sleep 5
                  done
              env:
                - name: VAULT_ADDR
                  value: http://127.0.0.1:8200
                - name: VAULT_UNSEAL_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-key
                      key: unseal-key
              resources:
                requests:
                  memory: 32Mi
                limits:
                  memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-tailscale-ingress
  namespace: vault
  annotations:
    tailscale.com/hostname: vault
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - vault
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-helm
                port:
                  number: 8200
