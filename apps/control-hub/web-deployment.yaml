apiVersion: apps/v1
kind: Deployment
metadata:
  name: golias-web
  namespace: control-hub
  labels:
    app.kubernetes.io/name: golias-web
    app.kubernetes.io/instance: golias-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golias-web
      app.kubernetes.io/instance: golias-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golias-web
        app.kubernetes.io/instance: golias-web
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: golias-web
          image: ghcr.io/pestana1213/golias-web
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Read at runtime by proxy.ts for the /v1/* upstream proxy.
            - name: GOLIAS_API_URL
              value: http://control-hub.control-hub.svc.cluster.local:8080
            # OpenTelemetry traces to Alloy (see apps/monitoring/README.md).
            - name: OTEL_SERVICE_NAME
              value: golias-web
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homelab,service.namespace=control-hub
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
