apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-hub
  namespace: control-hub
  labels:
    app.kubernetes.io/name: control-hub
    app.kubernetes.io/instance: control-hub
    app.kubernetes.io/component: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: control-hub
      app.kubernetes.io/instance: control-hub

  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-hub
        app.kubernetes.io/instance: control-hub
        app.kubernetes.io/component: backend

    spec:
      imagePullSecrets:
        - name: ghcr

      containers:
        - name: control-hub
          image: ghcr.io/pestana1213/control-hub

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prd"
            - name: OTEL_SERVICE_NAME
              value: control-hub
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homelab,service.namespace=control-hub
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: control-hub-db
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-hub-db
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"
